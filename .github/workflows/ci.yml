name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release --workspace

      - name: CLI smoke (exit-code contract)
        # GH Actions runs with bash -e: expected non-zero exits (2/4) would
        # terminate the script immediately. Collect codes with set +e, then
        # assert all at the end.
        run: |
          set +e
          ./target/release/arxivcat --json badcmd >/dev/null 2>&1; s1=$?
          ./target/release/arxivcat -w /__nope_ws__ paper list --json >/dev/null 2>&1; s2=$?
          ./target/release/arxivcat --version | grep -q '^arxivcat '; s3=$?
          test "$s1" -eq 2 && test "$s2" -eq 4 && test "$s3" -eq 0
