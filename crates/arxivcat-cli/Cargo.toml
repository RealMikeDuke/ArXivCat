[package]
name = "arxivcat-cli"
version = "0.11.13"
edition = "2021"
description = "CLI for ArxivCat - agent/script friendly"
license = "MIT"
repository = "https://github.com/RealMikeDuke/ArXivCat"

[[bin]]
name = "arxivcat"
path = "src/main.rs"

[dependencies]
arxivcat-core = { path = "../arxivcat-core", version = "0.11.13" }
clap = { workspace = true }
owo-colors = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "signal", "process", "io-util"] }
serde_json = { workspace = true }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
regex = { workspace = true }
tempfile = "3"
open = "5"
reqwest = { workspace = true }
glob = { workspace = true }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
flate2 = "1"
tar = "0.4"
