[package]
name = "arxivcat-cli"
version = "0.11.0"
edition = "2021"
description = "CLI for ArxivCat - agent/script friendly"

[[bin]]
name = "arxivcat"
path = "src/main.rs"

[dependencies]
arxivcat-core = { path = "../arxivcat-core" }
clap = { workspace = true }
owo-colors = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
serde_json = { workspace = true }
regex = { workspace = true }
tempfile = "3"
open = "5"
reqwest = { workspace = true }
glob = { workspace = true }
