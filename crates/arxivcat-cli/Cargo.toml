[package]
name = "arxivcat-cli"
version = "0.11.1"
edition = "2021"
description = "CLI for ArxivCat - agent/script friendly"
license = "MIT"
repository = "https://github.com/ArXivCat/arxivcat"

[[bin]]
name = "arxivcat"
path = "src/main.rs"

[dependencies]
arxivcat-core = { path = "../arxivcat-core", version = "0.11.1" }
clap = { workspace = true }
owo-colors = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
serde_json = { workspace = true }
regex = { workspace = true }
tempfile = "3"
open = "5"
reqwest = { workspace = true }
glob = { workspace = true }
