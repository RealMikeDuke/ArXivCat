[package]
name = "arxivcat-core"
version = "0.11.8"
edition = "2021"
description = "Core library for ArxivCat - arXiv paper extraction, workspace management, and chat"
license = "MIT"
repository = "https://github.com/RealMikeDuke/ArXivCat"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
regex = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }
lopdf = { workspace = true }
glob = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
